<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求根</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1a1a1a;
    --ink-soft: #3a3a3a;
    --paper: #f4ecd8;
    --paper-dark: #e8dcc0;
    --seal: #b22222;
    --gold: #a8842c;
  }

  body {
    min-height: 100vh;
    font-family: "Noto Serif SC", serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(168,132,44,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(178,34,34,0.06) 0%, transparent 35%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.04) 0%, transparent 60%),
      repeating-linear-gradient(45deg, rgba(168,132,44,0.015) 0px, rgba(168,132,44,0.015) 2px, transparent 2px, transparent 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 飘墨装饰 */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background: radial-gradient(circle, var(--ink), transparent 70%);
    top: -120px; left: -120px;
  }
  body::after {
    background: radial-gradient(circle, var(--seal), transparent 70%);
    bottom: -120px; right: -120px;
  }

  .scroll {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: linear-gradient(180deg, #faf3e0 0%, #f0e6cc 100%);
    border: 1px solid rgba(168,132,44,0.35);
    border-radius: 6px;
    padding: 48px 44px 40px;
    box-shadow:
      0 20px 60px rgba(60,40,10,0.25),
      inset 0 0 60px rgba(168,132,44,0.08);
  }

  /* 卷轴上下装饰条 */
  .scroll::before, .scroll::after {
    content: "";
    position: absolute;
    left: -10px; right: -10px;
    height: 14px;
    background: linear-gradient(90deg, #8b6914, #c9a84c, #8b6914);
    border-radius: 7px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .scroll::before { top: -7px; }
  .scroll::after { bottom: -7px; }

  .title-wrap {
    text-align: center;
    margin-bottom: 8px;
    position: relative;
  }

  .title {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 92px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: 12px;
    padding-left: 12px;
    text-shadow: 2px 3px 0 rgba(0,0,0,0.08);
  }

  /* 印章 */
  .seal {
    position: absolute;
    top: 18px;
    right: 30px;
    width: 52px;
    height: 52px;
    background: var(--seal);
    color: #fff;
    font-family: "Ma Shan Zheng", cursive;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transform: rotate(8deg);
    box-shadow: 0 4px 12px rgba(178,34,34,0.4);
    line-height: 1;
    text-align: center;
    opacity: 0.92;
  }
  .seal span { writing-mode: vertical-rl; letter-spacing: 2px; }

  .subtitle {
    text-align: center;
    font-family: "ZCOOL XiaoWei", serif;
    font-size: 17px;
    color: var(--ink-soft);
    letter-spacing: 4px;
    margin-bottom: 36px;
    margin-top: 6px;
  }
  .subtitle::before, .subtitle::after {
    content: "❖";
    color: var(--gold);
    margin: 0 14px;
    font-size: 12px;
  }

  .form-group {
    margin-bottom: 26px;
  }

  .form-group label {
    display: block;
    font-family: "ZCOOL XiaoWei", serif;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 10px;
    letter-spacing: 3px;
  }
  .form-group label .unit {
    font-size: 13px;
    color: var(--ink-soft);
    margin-left: 6px;
    letter-spacing: 1px;
  }

  .input-wrap {
    position: relative;
    border-bottom: 2px solid var(--ink-soft);
    padding: 4px 0;
    transition: border-color 0.3s;
  }
  .input-wrap:focus-within { border-color: var(--seal); }

  .input-wrap input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    color: var(--ink);
    padding: 8px 4px;
    outline: none;
    letter-spacing: 2px;
  }
  .input-wrap input::placeholder { color: rgba(0,0,0,0.25); }

  .btn {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: "Ma Shan Zheng", cursive;
    font-size: 28px;
    letter-spacing: 10px;
    padding-left: 18px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .btn:hover {
    background: var(--seal);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(178,34,34,0.4);
  }
  .btn:active { transform: translateY(0); }

  /* 结果区 */
  .result {
    margin-top: 34px;
    text-align: center;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.6s ease;
  }
  .result.show { opacity: 1; transform: translateY(0); }

  .result-label {
    font-family: "ZCOOL XiaoWei", serif;
    font-size: 16px;
    color: var(--ink-soft);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .result-value {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 64px;
    color: var(--seal);
    line-height: 1;
    text-shadow: 2px 3px 0 rgba(0,0,0,0.06);
  }
  .result-value .num { display: inline-block; animation: pop 0.5s ease; }
  .result-value .cm {
    font-size: 28px;
    color: var(--ink);
    margin-left: 6px;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-comment {
    font-family: "ZCOOL XiaoWei", serif;
    font-size: 15px;
    color: var(--gold);
    margin-top: 14px;
    letter-spacing: 2px;
    min-height: 22px;
  }

  .hint {
    text-align: center;
    color: rgba(0,0,0,0.3);
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .disclaimer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px dashed rgba(168,132,44,0.4);
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.8;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .disclaimer strong { color: var(--seal); }

  /* 错误提示 */
  .error-msg {
    color: var(--seal);
    font-size: 13px;
    margin-top: 6px;
    min-height: 18px;
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    .scroll { padding: 40px 26px 32px; }
    .title { font-size: 70px; }
    .seal { width: 44px; height: 44px; font-size: 18px; right: 18px; }
    .result-value { font-size: 52px; }
    .btn { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="scroll">
  <div class="title-wrap">
    <div class="title">求根</div>
    <div class="seal"><span>测算</span></div>
  </div>
  <div class="subtitle">量体裁衣 一算便知</div>

  <div class="form-group">
    <label>年 龄<span class="unit">岁</span></label>
    <div class="input-wrap">
      <input type="number" id="age" placeholder="请输入年龄" min="1" max="120">
    </div>
    <div class="error-msg" id="err-age"></div>
  </div>

  <div class="form-group">
    <label>体 重<span class="unit">公斤 / kg</span></label>
    <div class="input-wrap">
      <input type="number" id="weight" placeholder="请输入体重" min="1" max="500" step="0.1">
    </div>
    <div class="error-msg" id="err-weight"></div>
  </div>

  <div class="form-group">
    <label>身 高<span class="unit">厘米 / cm</span></label>
    <div class="input-wrap">
      <input type="number" id="height" placeholder="请输入身高" min="30" max="250" step="0.1">
    </div>
    <div class="error-msg" id="err-height"></div>
  </div>

  <button class="btn" id="calcBtn">起 算</button>
  <div class="hint">※ 所得之数 仅供博君一笑</div>

  <div class="result" id="result">
    <div class="result-label">推算根长</div>
    <div class="result-value" id="resultValue"></div>
    <div class="result-comment" id="resultComment"></div>
  </div>

  <div class="disclaimer">
    <strong>温馨提示</strong><br>
    此乃坊间戏言，依身高体重年龄按虚式推演，<br>
    并无科学依据，切莫当真，权作茶余饭后之乐。
  </div>
</div>

<script>
  const ageEl = document.getElementById('age');
  const weightEl = document.getElementById('weight');
  const heightEl = document.getElementById('height');
  const calcBtn = document.getElementById('calcBtn');
  const resultEl = document.getElementById('result');
  const resultValueEl = document.getElementById('resultValue');
  const resultCommentEl = document.getElementById('resultComment');

  function setError(id, msg) {
    document.getElementById(id).textContent = msg || '';
  }

  function clearErrors() {
    setError('err-age', '');
    setError('err-weight', '');
    setError('err-height', '');
  }

  function validate() {
    clearErrors();
    let ok = true;
    const age = parseFloat(ageEl.value);
    const weight = parseFloat(weightEl.value);
    const height = parseFloat(heightEl.value);

    if (!ageEl.value || isNaN(age)) { setError('err-age', '请输入年龄'); ok = false; }
    else if (age < 1 || age > 120) { setError('err-age', '年龄须在 1–120 之间'); ok = false; }

    if (!weightEl.value || isNaN(weight)) { setError('err-weight', '请输入体重'); ok = false; }
    else if (weight < 1 || weight > 500) { setError('err-weight', '体重须在 1–500 之间'); ok = false; }

    if (!heightEl.value || isNaN(height)) { setError('err-height', '请输入身高'); ok = false; }
    else if (height < 30 || height > 250) { setError('err-height', '身高须在 30–250 之间'); ok = false; }

    return ok ? { age, weight, height } : null;
  }

  // 坊间戏式：依身高、体重、年龄虚演根长（纯娱乐，无科学依据）
  function calcRootLength(age, weight, height) {
    // BMI 影响系数：偏瘦略增，偏胖略减
    const bmi = weight / Math.pow(height / 100, 2);
    let bmiFactor = 0;
    if (bmi < 20) bmiFactor = 0.6;
    else if (bmi < 25) bmiFactor = 0.2;
    else if (bmi < 30) bmiFactor = -0.4;
    else bmiFactor = -1.1;

    // 主式
    let len = (height * 0.045) + (weight * 0.022) - (age * 0.018) + 4.2 + bmiFactor;

    // 限定于合理娱乐区间
    len = Math.max(6.5, Math.min(20, len));
    return Math.round(len * 10) / 10;
  }

  function comment(len) {
    if (len < 9) return '小巧玲珑，藏锋守拙。';
    if (len < 11) return '中规中矩，不偏不倚。';
    if (len < 13) return '稳中有进，恰如其分。';
    if (len < 15) return '气宇轩昂，颇有可观。';
    if (len < 17) return '超群出众，英气逼人。';
    return '惊世骇俗，叹为观止。';
  }

  function animateNumber(target) {
    let current = target * 0.4;
    const steps = 20;
    const inc = (target - current) / steps;
    let i = 0;
    resultValueEl.innerHTML = '<span class="num">0.0</span><span class="cm">厘米</span>';
    const timer = setInterval(() => {
      i++;
      current += inc;
      if (i >= steps) {
        current = target;
        clearInterval(timer);
      }
      resultValueEl.innerHTML =
        '<span class="num">' + current.toFixed(1) + '</span><span class="cm">厘米</span>';
    }, 30);
  }

  calcBtn.addEventListener('click', () => {
    const data = validate();
    if (!data) {
      resultEl.classList.remove('show');
      return;
    }
    const len = calcRootLength(data.age, data.weight, data.height);
    resultEl.classList.add('show');
    resultCommentEl.textContent = comment(len);
    animateNumber(len);
  });

  // 回车提交
  [ageEl, weightEl, heightEl].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') calcBtn.click(); });
  });
</script>

</body>
</html>
